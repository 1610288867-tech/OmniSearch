[project]
name = "omnisearch"
version = "0.1.0"
description = "OmniSearch - local AI Hybrid Retrieval Engine (backend: FastAPI + AI Worker)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jieba>=0.42",      # FTS5 中文预分词（architecture.md §8.3）
    "watchdog>=4.0",    # 实时文件监听（architecture.md §11.4，ReadDirectoryChangesW）
    "pymupdf>=1.24",    # PDF 文本提取（architecture.md §10.4 document pipeline）
    "python-docx>=1.1", # DOCX 文本提取（architecture.md §10.4）
    "paddlepaddle==2.6.2",# PaddleOCR 推理后端（M3 冻结：3.x 在 Windows 有 oneDNN/PIR 兼容问题）
    "paddleocr==2.8.1",  # 图片文字识别（zh+en，architecture.md §10.4）
    "protobuf==3.20.2",  # paddle 2.6.2 兼容约束（qdrant-client REST 不受影响）
    "onnxruntime>=1.18", # BGE Embedding / Caption VLM 推理（M4，CPU）
    "qdrant-client>=1.11",# Qdrant Sidecar REST 客户端（M4）
    "xxhash>=3.4",       # point_id = xxh3_64(logical_key)（architecture.md §9.2 冻结）
    "tokenizers>=0.19",  # BGE tokenizer.json 加载
    "numpy>=1.26",       # embedding 向量运算
    "huggingface_hub>=0.24", # 模型下载（manifest 驱动）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnisearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
